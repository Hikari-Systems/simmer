# cargo-deny. The prompt requires a licence check on every mail-handling crate
# before adopting it, and several well-known Rust mail crates have been AGPL at
# some point in their history. Making that a CI failure rather than a discovery
# is the whole point of this file.

[licenses]
version = 2
# Permissive only. Anything outside this list needs an explicit decision and an
# entry below, not a silent addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

# Some allowed licences are not in the graph yet — 0BSD arrives with the mail
# crates in phase 4/5. Listing them ahead of adoption is deliberate, so don't
# warn about the ones nothing has matched.
unused-allowed-license = "allow"

# Crates with no `license` field at all. Exactly one now: `simmer` itself, which
# sets `publish = false` to say so deliberately.
#
# `hs-utils` used to be the other, and needed an `ignore-sources` exemption for
# the git source it came from. D-060 removed that dependency — its one used
# module is stdlib-only and now lives in `src/healthcheck.rs` — so the exemption
# is gone and a third-party crate with no licence still fails. See LICENSES.md §2.
[licenses.private]
ignore = true

[bans]
# Any copyleft licence fails by omission from the allow list above — there is no
# GPL/AGPL/LGPL/MPL entry, so such a crate cannot resolve. Verified 2026-08-07:
# none appears anywhere in the 241-package graph.
multiple-versions = "allow"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
# No `allow-git` list, deliberately: since D-060 there are no git dependencies at
# all, so this now denies *every* one of them. Adding a git dependency is a
# decision, and it should have to be made here rather than in a Cargo.toml line
# nobody reviews — a git tag is mutable, which is the whole reason the Dockerfile
# builds `--locked`.
unknown-git = "deny"
