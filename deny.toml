# cargo-deny. The prompt requires a licence check on every mail-handling crate
# before adopting it, and several well-known Rust mail crates have been AGPL at
# some point in their history. Making that a CI failure rather than a discovery
# is the whole point of this file.

[licenses]
version = 2
# Permissive only. Anything outside this list needs an explicit decision and an
# entry below, not a silent addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

# Some allowed licences are not in the graph yet — 0BSD arrives with the mail
# crates in phase 4/5. Listing them ahead of adoption is deliberate, so don't
# warn about the ones nothing has matched.
unused-allowed-license = "allow"

# Crates with no `license` field at all. Two of them, both in-house:
#
#   * `simmer` itself, which sets `publish = false`.
#   * `hs-utils`, consumed by git tag from a private repository. Every
#     hikari-systems Rust service has this gap; it is a metadata omission rather
#     than a licensing risk, and the fix belongs upstream in hs-utils-rs.
#
# Scoped to that one git source rather than switching the check off, so a third
# -party crate with no licence still fails. See LICENSES.md §2.
[licenses.private]
ignore = true
ignore-sources = ["https://github.com/Hikari-Systems/hs-utils-rs"]

[bans]
# Any copyleft licence fails by omission from the allow list above — there is no
# GPL/AGPL/LGPL/MPL entry, so such a crate cannot resolve. Verified 2026-08-07:
# none appears anywhere in the 241-package graph.
multiple-versions = "allow"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# hs-utils is consumed by git tag, per the house convention.
allow-git = ["https://github.com/Hikari-Systems/hs-utils-rs"]
