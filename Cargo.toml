[package]
name = "simmer"
version = "0.7.2"
edition = "2021"
# Never goes to crates.io. Also what tells cargo-deny this crate's missing
# `license` field is deliberate rather than an oversight.
publish = false

# A library plus a thin binary, so the logic-heavy parts (config validation,
# sender matching, and later the rewrite engine and reply mapping) are reachable
# from integration tests in tests/ without spawning a process.
[lib]
name = "simmer"
path = "src/lib.rs"

# Binary is `server` to match every other hikari-systems Rust service, so the
# Dockerfile, the HEALTHCHECK subcommand and the compose healthcheck are the
# same shape here as everywhere else.
[[bin]]
name = "server"
path = "src/main.rs"

# No `unsafe` in this crate: the library, `server`, `loadgen`, `sink` and every
# integration test. `forbid`, not `deny`, so no `#[allow]` inside the source can
# lift it. The `unsafe` Simmer runs is in its dependencies — jemalloc's crates
# above all (D-078, D-092) — which a package's lints do not reach, by design.
# `#[global_allocator]` needs none of ours.
[lints.rust]
unsafe_code = "forbid"

# D-084: the storage backend is chosen at compile time, one per image. The
# default build is Postgres, exactly as before; the SQL Server image is built
# with `--no-default-features --features mssql` and published as
# `hikarisystems/simmer:vX.Y.Z-mssql`. Exactly one must be enabled —
# `src/db/mod.rs` refuses to compile otherwise, so a build can never carry two
# storage layers and pick between them at runtime.
[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
mssql = ["dep:tiberius", "dep:bb8", "dep:tokio-util"]
# D-092 — jemalloc's own counters, written to a file for the soak tier to sample.
# NOT in any published image: jemalloc's `stats` changes the allocator, and the
# shipped binary stays as D-078 measured it. Only the soak run turns it on.
alloc-stats = ["tikv-jemallocator/stats", "dep:tikv-jemalloc-ctl"]

[dependencies]
# Runtime. `rt-multi-thread` + `net` + `signal` because main owns a set of peer
# tasks (SMTP listener, admin server, sweepers) joined under one shutdown.
tokio = { version = "1", features = ["full"] }

# Storage. `runtime-tokio-rustls` is deliberate and matches the house pattern:
# it keeps openssl/pkg-config out of the build entirely, so the bookworm-slim
# runtime image needs nothing beyond libc.
sqlx = { version = "0.8", optional = true, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "migrate",
] }

# D-084, the `mssql` feature only. sqlx dropped its SQL Server driver in 0.7, so
# this is tiberius, the async TDS client. `MIT/Apache-2.0`.
#
# `native-tls` — OpenSSL on Linux — and not the `rustls` feature, which is what
# the rest of this crate would suggest. tiberius 0.12.3 (the latest release, July
# 2024) pins tokio-rustls 0.24, i.e. rustls 0.21 and rustls-webpki 0.101, which
# carries RUSTSEC-2026-0098, -0099 and -0104 with no fixed 0.101 release; its
# `main` has moved on but is unpublished, and a git dependency is a decision
# (CLAUDE.md). OpenSSL is maintained and patched by the base image's security
# updates. It reaches only the `-mssql` image: the Postgres build does not
# compile tiberius at all. `winauth` (NTLM) is off with the other defaults.
tiberius = { version = "0.12", optional = true, default-features = false, features = [
    "tds73",
    "native-tls",
    "chrono",
] }
# The pool for the above. `MIT`. bb8 rather than the bb8-tiberius or
# deadpool-tiberius adapters: both enable tiberius' default features (`winauth`
# among them) and neither lets a connection be marked broken after a failed
# transaction, which `src/db/mssql.rs` needs. The adapter is short.
bb8 = { version = "0.9", optional = true }
# tiberius speaks futures-io; tokio's TcpStream speaks tokio-io. `MIT`.
tokio-util = { version = "0.7", optional = true, features = ["compat"] }

# Config. SPEC.md §4 mandates YAML with ${ENV_VAR} interpolation, so this does
# NOT use the house config.json layering — see DECISIONS.md D-004.
# serde_yaml is unmaintained (it is literally published as "0.9.34+deprecated");
# serde_yaml_ng is the maintained continuation.
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

# Admin listener (§9). SPEC.md §12.1 suggests axum and nothing in the house
# storage pattern reaches the HTTP layer — see DECISIONS.md D-003.
axum = "0.8"
serde_json = "1"

# §9.5 structured JSON logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
thiserror = "2"

# §5.1 allowed_cidrs.
ipnet = "2"
# §4.2 "a body_rewrites.pattern fails to compile" is a startup validation rule,
# so the regex engine is needed in phase 1 even though §6.4 lands in phase 5.
regex = "1"

chrono = { version = "0.4", features = ["serde"] }

# --- phase 2 -------------------------------------------------------------
# Licences verified across every published version before adoption, per the
# kickoff prompt. See LICENSES.md §4.

# §5.4 routing on `match_on: from_header` needs the first From: address before a
# route can be picked, and §5.4 also owes a `550 5.6.0 malformed From header`.
# Hand-rolling an RFC 5322 address parser for that is where subtle bugs live.
# Header extraction only in phase 2; the rewrite engine (phase 4) is what this
# crate is really here for. `Apache-2.0 OR MIT` for all 36 published versions.
mail-parser = "0.11"

# §5.3 — credentials are argon2id hashes, compared in constant time.
# `std` for `hash-password`'s OsRng salt (rand_core's `getrandom`). It used to
# arrive only through sqlx's feature unification, so the `mssql` build — which
# has no sqlx — failed to compile without naming it here (D-084).
argon2 = { version = "0.5", features = ["std"] }

# AUTH PLAIN / LOGIN payloads (§5.3).
base64 = "0.22"

# §8.1 — the DATA buffer spills above 1 MiB. `tempfile()` hands back an already
# unlinked file, so §8.1's "deleted when the session ends" is the OS's job and
# survives a panic between here and the end of the session.
tempfile = "3"

# §9.5 correlation_id.
uuid = { version = "1", features = ["v4"] }

# §8.2 outbound TLS. `ring` rather than the default `aws-lc-rs`: aws-lc-rs wants
# cmake and a C toolchain in the builder image, and sqlx already pulls rustls
# with ring through `runtime-tokio-rustls`, so this keeps one provider in the
# graph instead of two.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# §8.2: "rustls with the platform root store". The runtime image installs
# ca-certificates for exactly this.
rustls-native-certs = "0.8"
# §5.1 inbound TLS (D-070): whether the certificate covers `server.hostname`, by
# the same name-matching code a verifying client runs. Already in the graph as
# rustls's own verifier, at the version rustls pins, so this names a crate the
# build already compiles rather than adding one. PEM parsing needs nothing new
# either: `rustls-pki-types` has had it since 1.9, which is why
# `rustls-pemfile` — archived upstream, RUSTSEC-2025-0134 (unmaintained), which
# would fail `cargo deny check`'s advisories — is not used.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
    "alloc",
] }

# §9.1 counters. With no recorder installed these compile to no-ops; phase 7
# adds `metrics-exporter-prometheus` and nothing here moves. See DECISIONS.md
# D-021.
metrics = "0.24"

# --- phase 3 -------------------------------------------------------------

# §11: "The storage layer sits behind a trait so the concrete backend can be
# substituted." That trait is held as `Arc<dyn QuotaStore>`, and `async fn` in a
# trait is not yet dyn-compatible. `MIT OR Apache-2.0`, every published version.
async-trait = "0.1"

# `hs-utils` was here, for `healthcheck::check_subcommand` alone. Removed in
# phase 7 (D-060): that module is stdlib-only and now lives in
# `src/healthcheck.rs`, behaving identically. Nothing else in this crate ever
# used it — config, logging, the pool and the HTTP layer all diverge by
# decision (D-003 through D-006), so one small file was the entire coupling.
#
# Simmer now has **no git dependencies at all**, which is why `deny.toml` has no
# `allow-git` entry and no `ignore-sources` exemption.

# --- phase 6 -------------------------------------------------------------

# §7.3: "The stored key is a salted hash of the normalised value, never
# plaintext." HMAC-SHA256 keyed with the persisted salt. Both crates are already
# in the graph — sqlx-postgres pulls them for SCRAM authentication — so this
# takes a direct dependency on versions that are already being compiled, and adds
# nothing to the build. `MIT OR Apache-2.0`, every published version of each.
#
# Deliberately not argon2, which is already a dependency: §5.3 wants a password
# hash to be slow, and this runs on the message path for every recipient of every
# message. The threat model is different too — the salt and the hashes live in
# the same database, so slowness buys nothing an attacker with the table cannot
# already have. What §7.3 asks for is that the container stop *accumulating*
# plaintext, and a keyed hash does that.
sha2 = "0.10"
hmac = "0.12"

# --- phase 7 -------------------------------------------------------------

# §9.1 "Prometheus exposition on the admin listener". `default-features = false`
# is load-bearing: the default set pulls hyper, hyper-util, http-body-util and a
# push-gateway client so the exporter can run its *own* HTTP listener, and axum
# already owns the admin port. With no features it is a recorder plus
# `PrometheusHandle::render()`, which is exactly what `GET /metrics` needs.
# `MIT`, every published version — see LICENSES.md §5.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# D-093: `MetricKindMask`, for the exporter's idle timeout. Already in the tree
# as the exporter's own dependency, at the same version; no features needed.
metrics-util = { version = "0.20", default-features = false }

# §9.3's bearer token, compared in constant time. Already in the graph via
# argon2/password-hash, so this takes a direct dependency on a crate that is
# already being compiled. `BSD-3-Clause`.
#
# The comparison has to be constant-time for the same reason §5.3's does: an
# admin token is a shared secret compared against attacker-supplied bytes, and
# `==` on a byte slice returns as soon as it finds a difference. See the
# `smtp/auth.rs` defect for what happens when that reasoning is applied to one
# comparison and not another.
subtle = "2"

# --- phase 8 -------------------------------------------------------------

# §6.7's DNS preflight, and §12.1's suggestion. `MIT OR Apache-2.0` for all 21
# published versions — 20 spell it that way and `0.1.0` uses the deprecated
# `MIT/Apache-2.0` slash syntax for the same two licences. No version has ever
# been AGPL, which is the risk §12.1 flags for this corner of the ecosystem.
# See LICENSES.md.
#
# `default-features = false` with the default set named explicitly, so a future
# default change is a decision rather than a surprise. `system-config` reads
# `/etc/resolv.conf`; `tokio` is the runtime. Deliberately **not** the `__tls`,
# `__quic`, `__https` or `dnssec-*` features: SPF, DKIM and DMARC records are
# public TXT lookups against the container's own resolver, so DoT/DoH/DNSSEC
# would add a TLS stack and a trust decision to fetch data that is public by
# design and whose failure mode is already non-blocking (§6.7).
hickory-resolver = { version = "0.26", default-features = false, features = [
    "system-config",
    "tokio",
] }

# --- the test programme ----------------------------------------------------

# The server's global allocator (D-078, finding F15). glibc's malloc kept
# argon2's freed 19 MiB AUTH blocks resident: past the first free its dynamic
# mmap threshold rises, later blocks come from per-thread arenas — up to eight
# per host CPU — and stay there, so one login per message drove the server to a
# 1 GiB limit in seconds. jemalloc, chosen over mimalloc on measurement (D-078):
# peaks a quarter to three-fifths as high on bulk-sending loads, at the cost of
# slower one-login-per-message traffic. Set in `src/main.rs` only, so it is the
# server binary's choice and not
# the library's. `MIT/Apache-2.0` for every published version of both crates; the
# jemalloc C library they vendor is `BSD-2-Clause` (LICENSES.md §7). Default
# features, which include `background_threads_runtime_support`: the purge thread
# can be turned on through `_RJEM_MALLOC_CONF` without a rebuild.
tikv-jemallocator = "0.7"
# D-092, behind `alloc-stats` only. The same family and version line as the
# allocator above, and a safe API: `epoch::advance` and the `stats` reads.
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["stats"] }

# --- the link proxy (D-083) -----------------------------------------------

# D-083: an optional HTTP/1.x listener that forwards tracking and unsubscribe
# clicks to one upstream. Off the shelf, per the request: hop-by-hop stripping,
# X-Forwarded-*, the upstream timeout, the body cap and loop detection are all
# the crate's. `MIT`. Pinned to the minor because `ProxyPolicy`'s defaults are
# behaviour, and a minor release may move them.
#
# `default-features = false` is load-bearing: its `tls` feature pulls
# `hyper-rustls` with *that* crate's defaults, which are aws-lc-rs (cmake and a C
# toolchain in the builder — see the `rustls` entry above) and webpki-roots
# rather than §8.2's platform store. The client is built here instead and handed
# to `ReverseProxy::new_with_client`.
axum-reverse-proxy = { version = "~2.2", default-features = false }
# The upstream connector for the above, HTTP/1 only. `Apache-2.0 OR ISC OR MIT`.
# It is handed `TlsConfigs`' verifying `ClientConfig` — the same ring provider
# and the same platform root store as `tls: required_verify` routes (§8.2) — so
# it needs neither `native-tokio` nor `webpki-roots`.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
    "logging",
] }
# Both already in the graph via axum; named here for the features the listener
# (`http1::Builder` with a header-read timeout) and the client need.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "http1",
    "tokio",
    "service",
] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[dev-dependencies]
# §6.6 — "enforced by a property test over generated messages". `MIT OR
# Apache-2.0` for all 48 published versions (the 38 before 1.3.0 spell it with
# the deprecated slash syntax). Default features off: `fork` and `timeout` pull
# rusty-fork, wait-timeout and quick-error for a process-isolation harness the
# stability property does not need.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

# §9 — drives the real `admin::router` in-process, so the tests exercise the
# actual middleware stack, extractors and status codes rather than a
# reimplementation of them. Both crates are already in the graph via axum, so
# this adds nothing to the build.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# §5.1 inbound TLS tests (D-070): self-signed certificates minted per test, so
# nothing in the repository is a private key and nothing expires in CI. `MIT OR
# Apache-2.0`. `ring` rather than the default `aws-lc-rs`, for the reason the
# rustls entry above gives.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
