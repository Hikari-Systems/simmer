name: Acceptance (manual)

# D-042 item 3: the §12.3 acceptance suite runs on manual dispatch, not on every
# push — it builds the release image and restarts the app container once per
# simulated day, which is minutes of work that a lint fix does not need. Decided in
# phase 4 and not built until D-073.
#
# A separate workflow rather than a `workflow_dispatch` trigger on build.yml, so
# that dispatching it never builds or pushes an image to GHCR.
#
# The nightly test programme (docs/TESTING.md, once it exists) will run this suite
# on a schedule too; this job stays as the one-button way to run it on any branch.

on:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # The host side is `cargo test --test acceptance`, which needs the test
      # binary compiled; the same cache build.yml's check job writes serves it.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      # The images first — app, tls-init and the loadgen — then only the
      # long-running services. `up --wait` fails on any container that exits,
      # even with 0, unless another service depends on it: tls-init is a
      # completed dependency of app and is fine, but the one-shot loadgen is not,
      # and a whole-project `up --wait` failed this step with everything healthy
      # ("container simmer-loadgen-1 exited (0)"). The suite runs the loadgen
      # itself, with `compose run`, so it only needs to be built here.
      # Override file included: it carries the test CA's OS trust store.
      - name: Build the acceptance images
        run: docker compose -f docker-compose.yml -f test/compose/acceptance.yml --profile acceptance build

      - name: Bring up the acceptance stack
        run: docker compose -f docker-compose.yml -f test/compose/acceptance.yml --profile acceptance up -d --wait app trap-warming trap-overflow otel-collector

      - name: Run the acceptance suite
        run: cargo test --locked --test acceptance -- --ignored --test-threads=1

      # D-101 — the OTLP export, read back from the dummy collector's files.
      - name: Run the telemetry export test
        run: cargo test --locked --test telemetry_compose -- --ignored --test-threads=1

      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.yml -f test/compose/acceptance.yml --profile acceptance logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f test/compose/acceptance.yml --profile acceptance down -v
