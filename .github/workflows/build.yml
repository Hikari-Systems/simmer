name: Build and push to GHCR

on:
  push:
    # `**`, not `*`: in a branch filter `*` matches any character *except* `/`,
    # so `'*'` silently excluded every `feat/…`-style branch — the push simply
    # started no run, which reads exactly like a green build. That is how
    # D-096's workflow change reached `main` untested. `**` matches slashes too.
    # Safe because the one place a branch name becomes an image tag
    # (`merge-manifest`) already folds anything outside the tag alphabet to `-`,
    # which is why it was written that way.
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  # NOT the house shape. The standard hikari-systems build.yml runs no
  # `cargo test`, `clippy` or `fmt --check` (tracked as HIK-167) and the gate is
  # local instead. Simmer adds this job because its central correctness argument
  # is a property test — the SPEC.md §6.6 rewrite-stability check — and a
  # property test that never runs is decoration.
  #
  # `--locked` throughout, so a silent lock bump cannot become a silent
  # dependency bump. This was written when hs-utils was a git-tag dependency;
  # D-060 removed it and there are no git dependencies at all now, but the
  # reason holds for crates.io too — `cargo deny check` is only a gate on the
  # graph that actually resolves.
  #
  # amd64 jobs run on the org's self-hosted public runners: two runners on one
  # persistent host. Two things follow from that, throughout this file. No job
  # binds a fixed host port — two jobs on that host at once would collide — so
  # each service publishes to a random port and the job reads it back from
  # `job.services`. And nothing a job creates outlives it: containers are
  # named per run and removed, and registry logins go to an auth file under
  # $RUNNER_TEMP, which the runner deletes, not to the runner user's home.
  check:
    runs-on: self-hosted-public-amd64
    timeout-minutes: 25

    services:
      # tests/quota.rs and tests/quota_relay.rs use `#[sqlx::test]`, which needs a
      # real Postgres (DECISIONS.md D-031). Faking it would defeat the point:
      # SPEC.md §12.3's overshoot test is a claim about what two transactions do
      # to one row simultaneously, and a post-hoc increment passes every other
      # test in the suite and fails that one.
      #
      # Pinned to the same major version as docker-compose.yml. A quota model
      # whose correctness rests on row locking should not be tested against a
      # different engine than it runs on.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: simmer
          POSTGRES_USER: simmer
          POSTGRES_PASSWORD: simmer
        ports:
          # A random host port, not the local development URL's 5433: the
          # self-hosted runners share a host, so a fixed port is one that two
          # jobs fight over. DATABASE_URL is set from the port below.
          - 5432
        options: >-
          --health-cmd "pg_isready -U simmer -d simmer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Point DATABASE_URL at the service
        run: echo "DATABASE_URL=postgres://simmer:simmer@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/simmer" >> "$GITHUB_ENV"

      # One Rust home per runner, not the runner user's shared ~/.rustup: the
      # self-hosted runners on a host run as one user, and two jobs installing
      # into one toolchain directory at once break each other ("could not
      # rename component file ... Directory not empty"). A runner runs one job
      # at a time, so its own home is never written concurrently, and it keeps
      # its toolchain between jobs.
      - name: Per-runner Rust home
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"

      # The self-hosted image has no Rust; Blacksmith's came with it.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The check job compiles because `cargo test` cannot run without building
      # the test binaries. It cannot share that work with the `build` job below —
      # that one is release profile with lto + codegen-units=1, inside a
      # container, per architecture, so the two builds have no artifacts in
      # common even in principle.
      #
      # What *is* shareable is the dependency graph: 252 crates, pinned by a
      # committed Cargo.lock and built with --locked, so they are identical on
      # every run. Rebuilding the workspace crate itself takes about 4 seconds;
      # everything else in this job is those dependencies. `cargo clippy` sets
      # RUSTC_WORKSPACE_WRAPPER rather than RUSTC_WRAPPER, so it reuses their
      # artifacts too and only re-checks our own crate — meaning one cached
      # dependency build serves fmt, clippy and test alike.
      #
      # Saved only from main: a cache written on the default branch is readable
      # from every branch, whereas per-branch caches would each write a copy and
      # evict one another under the repository cache quota.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # No fixture step, and that is deliberate: `#[sqlx::test]` creates a fresh
      # database per test and applies `migrations/` to it, so the migrations are
      # the fixtures and every test builds the state it needs. Seeding shared data
      # here would give the tests a hidden dependency on each other, which is the
      # first thing that goes wrong in a suite that asserts on counters.
      #
      # What the service above must provide is therefore only: a reachable
      # database, and a role that may CREATE DATABASE. `POSTGRES_USER` on the
      # official image is a superuser, so both hold.
      - name: Test
        run: cargo test --locked

      # See LICENSES.md. Several well-known Rust mail crates have been AGPL at
      # some point in their history, so this is a build failure rather than a
      # discovery. Also covers advisories and unexpected sources.
      #
      # Installed as a prebuilt binary rather than `cargo install cargo-deny`,
      # which compiles it from source on every run — several minutes of work to
      # produce a tool that is byte-identical each time. Deliberately not
      # EmbarkStudios/cargo-deny-action: keeping the bare `cargo deny check`
      # means CI runs exactly the command the README tells a developer to run.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, advisories, sources
        run: cargo deny check
  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: self-hosted-public-amd64
          - platform: arm64
            runner: self-hosted-public-arm64
    services:
      registry:
        image: registry:3.0
        env:
          REGISTRY_STORAGE: s3
          REGISTRY_STORAGE_S3_ACCESSKEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          REGISTRY_STORAGE_S3_SECRETKEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY_STORAGE_S3_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY_STORAGE_S3_BUCKET: hikari-docker-registry
          REGISTRY_HTTP_ADDR: :5000
          REGISTRY_HTTP_SECRET: ${{ secrets.DOCKER_REGISTRY_SECRET }}
    steps:
      - name: Make repo name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | sed -e 's/^Hikari-Systems\///')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # `--target runtime` is load-bearing. The Dockerfile's last stage is
      # `acceptance` (the loadgen, entrypoint /app/loadgen), and an unpinned
      # `docker build` produces the *last* stage — so without this line every
      # image pushed to GHCR since phase 4 was the load generator, not the
      # server. CLAUDE.md and docker-compose.yml both say so; this is the
      # deployment pipeline they were warning. See DECISIONS.md D-073.
      #
      # Built the way the woodhouse repos build, since both arches now run on
      # self-hosted runners and the arm64 one is a container under Docker
      # Desktop on the Mac: a buildx builder on the job's Docker network, so it
      # reaches the plain-HTTP registry service by name and needs no host port —
      # under Docker Desktop a Docker-assigned host port is not reachable from
      # there. That also keeps two jobs on the amd64 host from colliding over a
      # fixed one.
      #
      # It replaced Blacksmith's sticky-disk builder, which only exists on
      # Blacksmith. The layer cache now lives in the same S3-backed registry,
      # one cache tag per image and platform since each one's layers differ, so
      # the Dockerfile's dependency-stub layer is still found on the next build.
      # (`type=gha` was tried first and lost: see git history, 2a92690.) No
      # provenance or SBOM: they would turn the per-platform tag into an index,
      # which `docker manifest create` refuses.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=${{ job.container.network }}
          buildkitd-config-inline: |
            [registry."registry:5000"]
              http = true
              insecure = true

      - name: Build and push to S3 registry
        run: |
          CACHE=registry:5000/${{ env.REPO_NAME }}:buildcache-${{ matrix.platform }}
          docker buildx build --target runtime --platform linux/${{ matrix.platform }} \
            --cache-from type=registry,ref=$CACHE \
            --cache-to type=registry,ref=$CACHE,mode=max,image-manifest=true,oci-mediatypes=true \
            --provenance=false --sbom=false --push \
            -t registry:5000/${{ env.REPO_NAME }}:${{ github.sha }}-${{ matrix.platform }} .

  merge-manifest:
    runs-on: self-hosted-public-amd64
    timeout-minutes: 10
    needs: build
    services:
      registry:
        image: registry:3.0
        env:
          REGISTRY_STORAGE: s3
          REGISTRY_STORAGE_S3_ACCESSKEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          REGISTRY_STORAGE_S3_SECRETKEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY_STORAGE_S3_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY_STORAGE_S3_BUCKET: hikari-docker-registry
          REGISTRY_HTTP_ADDR: :5000
          REGISTRY_HTTP_SECRET: ${{ secrets.DOCKER_REGISTRY_SECRET }}
          REGISTRY_STORAGE_DELETE_ENABLED: "true"
        ports:
          - 5000
    steps:
      - name: Make repo name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | sed -e 's/^Hikari-Systems\///')" >> $GITHUB_ENV

      - name: Point REGISTRY at the service
        run: echo "REGISTRY=localhost:${{ job.services.registry.ports['5000'] }}" >> "$GITHUB_ENV"

      # A branch name is not always a valid image tag. Since the trigger widened
      # to `**` a `feat/…` branch does reach here, and anything outside the tag
      # alphabet becomes `-`: `feat/mssql-arm64` publishes as `feat-mssql-arm64`.
      - name: Make branch name
        run: echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's/^refs\/heads\///' -e 's/[^A-Za-z0-9_.-]/-/g')" >> $GITHUB_ENV

      # Already on the self-hosted host, whose runner user has no sudo.
      - name: Install skopeo
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi

      - name: Log in to GHCR via skopeo
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/containers-auth.json" >> "$GITHUB_ENV"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/containers-auth.json"
          skopeo login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_TOKEN }}

      - name: Create multi-arch manifest in S3 registry
        run: |
          docker manifest create --insecure ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-arm64
          docker manifest push --purge --insecure ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}

      - name: Copy multi-arch manifest from S3 registry to GHCR
        run: |
          # `latest` only from main (D-104): a branch push used to move it too,
          # so whichever branch built last was what `:latest` pulled.
          TAGS="${{ github.sha }} ${{ env.BRANCH_NAME }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS latest"
          fi
          for TAG in $TAGS; do
            skopeo copy \
              --all \
              --src-tls-verify=false \
              docker://${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }} \
              docker://ghcr.io/hikari-systems/${{ env.REPO_NAME }}:${TAG}
          done

  # ── D-084: the SQL Server build ─────────────────────────────────────────────
  # The same gate as `check`, for `--no-default-features --features mssql`,
  # against a real SQL Server. `tests/store_mssql.rs` runs the §11 conformance
  # suite — the one `tests/store_postgres.rs` runs against Postgres in `check` —
  # plus the migration runner's own tests. Everything above the storage trait is
  # backend-neutral and runs here too; the Postgres-backed relay and admin tests
  # are compiled out of this build.
  # Run on both arches (D-096). Microsoft still publishes no arm64 SQL Server
  # image — every `mcr.microsoft.com/mssql/server` tag, 2025 included, is a
  # single-platform amd64 manifest — so the arm64 leg runs against Azure SQL
  # Edge, which is the same engine, is genuinely multi-arch, and is retired.
  # D-096 records why a retired image is acceptable here and why the obvious
  # alternative, Babelfish, is not.
  check-mssql:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      # Both legs report. They run against different engines, so a failure on
      # one is a fact about that engine and not a reason to hide the other.
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: self-hosted-public-amd64
            db_image: mcr.microsoft.com/mssql/server:2022-latest
          - platform: arm64
            runner: self-hosted-public-arm64
            db_image: mcr.microsoft.com/azure-sql-edge:latest

    env:
      # Named per run and leg: on the shared self-hosted host a fixed name
      # collides with a concurrent run, or with one that was cancelled before
      # its teardown.
      DB_CONTAINER: simmer-ci-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # One Rust home per runner; see `check` above for why.
      - name: Per-runner Rust home
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Started here rather than as a `services:` container. The health check
      # this job used to carry ran `sqlcmd` inside the container, and Azure SQL
      # Edge ships no `sqlcmd` at all — so it cannot be reused on the arm64 leg.
      # Both images log the same readiness line, so one wait covers both and the
      # legs stay identical apart from the image name. `ACCEPT_EULA=Y` is
      # accepted by both (Edge's own docs say `1`).
      - name: Start SQL Server
        run: |
          docker run -d --name "$DB_CONTAINER" -p 127.0.0.1::1433 \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Simmer-ci-1!' \
            -e MSSQL_PID=Developer \
            ${{ matrix.db_image }}
          # The login the harness creates one database per test with, on
          # whichever host port Docker picked (1434 locally, per
          # docker-compose.yml's `mssql` profile).
          port="$(docker port "$DB_CONTAINER" 1433/tcp | head -n1 | sed 's/.*://')"
          echo "MSSQL_URL=server=tcp:127.0.0.1,$port;user id=sa;password=Simmer-ci-1!;TrustServerCertificate=true" >> "$GITHUB_ENV"

      # Polls the log rather than the port: the listener binds before recovery
      # finishes, so a TCP check reports ready while a login would still fail.
      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 60); do
            if docker logs "$DB_CONTAINER" 2>&1 \
                 | grep -q 'SQL Server is now ready for client connections'; then
              echo "ready"
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER"; then
              echo "::error::${{ matrix.db_image }} exited before becoming ready"
              docker logs --tail 50 "$DB_CONTAINER"
              exit 1
            fi
            sleep 5
          done
          echo "::error::${{ matrix.db_image }} was not ready within 5 minutes"
          docker logs --tail 50 "$DB_CONTAINER"
          exit 1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Its own key per arch: the feature sets resolve different dependency
          # graphs, and the two runners' artefacts are not interchangeable.
          key: mssql-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo fmt` is feature-independent and `check` already ran it.
      - name: Clippy
        run: cargo clippy --all-targets --locked --no-default-features --features mssql -- -D warnings

      - name: Test
        run: cargo test --locked --no-default-features --features mssql

      - name: Install cargo-deny
        if: matrix.platform == 'amd64'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The mssql graph is not the default graph: tiberius, bb8 and OpenSSL are
      # only in this one, so the licence and advisory gate has to see it. Once,
      # on amd64: the resolved graph is the same on both arches, and `cargo deny`
      # judges the graph rather than the build.
      - name: Licences, advisories, sources
        if: matrix.platform == 'amd64'
        run: cargo deny --no-default-features --features mssql check

      - name: Remove SQL Server
        if: always()
        run: docker rm -f "$DB_CONTAINER" || true

  # Multi-arch since D-096, and so built the way `build` is: each platform on a
  # runner of its own, staged in the S3 registry, merged by the job below. Not
  # one job with `platforms: linux/amd64,linux/arm64` — that builds the foreign
  # arch under QEMU, and emulating a ~240-crate Rust compile is not a trade worth
  # making when native runners exist.
  build-mssql:
    needs: check-mssql
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: self-hosted-public-amd64
          - platform: arm64
            runner: self-hosted-public-arm64
    services:
      registry:
        image: registry:3.0
        env:
          REGISTRY_STORAGE: s3
          REGISTRY_STORAGE_S3_ACCESSKEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          REGISTRY_STORAGE_S3_SECRETKEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY_STORAGE_S3_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY_STORAGE_S3_BUCKET: hikari-docker-registry
          REGISTRY_HTTP_ADDR: :5000
          REGISTRY_HTTP_SECRET: ${{ secrets.DOCKER_REGISTRY_SECRET }}
    steps:
      - name: Make repo name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | sed -e 's/^Hikari-Systems\///')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # `target: runtime` for the same reason as `build` (D-073), and built the
      # same way too, under a cache tag of its own per arch: the feature set
      # compiles a different dependency graph, and each platform's layers differ.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=${{ job.container.network }}
          buildkitd-config-inline: |
            [registry."registry:5000"]
              http = true
              insecure = true

      - name: Build and push to S3 registry
        run: |
          CACHE=registry:5000/${{ env.REPO_NAME }}:buildcache-mssql-${{ matrix.platform }}
          docker buildx build --target runtime --platform linux/${{ matrix.platform }} \
            --build-arg 'CARGO_FEATURES=--no-default-features --features mssql' \
            --cache-from type=registry,ref=$CACHE \
            --cache-to type=registry,ref=$CACHE,mode=max,image-manifest=true,oci-mediatypes=true \
            --provenance=false --sbom=false --push \
            -t registry:5000/${{ env.REPO_NAME }}:${{ github.sha }}-mssql-${{ matrix.platform }} .

  # The `-mssql` half of `merge-manifest`, kept separate so the two images can
  # fail independently: a broken SQL Server build must not stop the Postgres
  # image publishing, which is what almost every deployment runs.
  merge-manifest-mssql:
    runs-on: self-hosted-public-amd64
    timeout-minutes: 10
    needs: build-mssql
    services:
      registry:
        image: registry:3.0
        env:
          REGISTRY_STORAGE: s3
          REGISTRY_STORAGE_S3_ACCESSKEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          REGISTRY_STORAGE_S3_SECRETKEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY_STORAGE_S3_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY_STORAGE_S3_BUCKET: hikari-docker-registry
          REGISTRY_HTTP_ADDR: :5000
          REGISTRY_HTTP_SECRET: ${{ secrets.DOCKER_REGISTRY_SECRET }}
          REGISTRY_STORAGE_DELETE_ENABLED: "true"
        ports:
          - 5000
    steps:
      - name: Make repo name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | sed -e 's/^Hikari-Systems\///')" >> $GITHUB_ENV

      - name: Point REGISTRY at the service
        run: echo "REGISTRY=localhost:${{ job.services.registry.ports['5000'] }}" >> "$GITHUB_ENV"

      - name: Make branch name
        run: echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's/^refs\/heads\///' -e 's/[^A-Za-z0-9_.-]/-/g')" >> $GITHUB_ENV

      # Already on the self-hosted host, whose runner user has no sudo.
      - name: Install skopeo
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi

      - name: Log in to GHCR via skopeo
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/containers-auth.json" >> "$GITHUB_ENV"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/containers-auth.json"
          skopeo login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_TOKEN }}

      - name: Create multi-arch manifest in S3 registry
        run: |
          docker manifest create --insecure ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-mssql \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-mssql-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-mssql-arm64
          docker manifest push --purge --insecure ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-mssql

      - name: Copy multi-arch manifest from S3 registry to GHCR
        run: |
          # `latest-mssql` only from main (D-104): a branch push used to move it too,
          # so whichever branch built last was what `:latest-mssql` pulled.
          TAGS="${{ github.sha }}-mssql ${{ env.BRANCH_NAME }}-mssql"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS latest-mssql"
          fi
          for TAG in $TAGS; do
            skopeo copy \
              --all \
              --src-tls-verify=false \
              docker://${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}-mssql \
              docker://ghcr.io/hikari-systems/${{ env.REPO_NAME }}:${TAG}
          done
