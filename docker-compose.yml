# Local development and testing only. This file is never deployed.
#
# Brings up Simmer plus its Postgres, per SPEC.md §12.2.

services:
  app:
    build:
      context: .
      # Explicit, and load-bearing: the Dockerfile's last stage is `acceptance`
      # (it has to come after `runtime`, since it builds on it), and an unpinned
      # target means the *last* stage. Without this line `app` is built as the
      # acceptance suite's loadgen and exits immediately.
      target: runtime
    ports:
      # §12.2 and §2.3: port 25 is deliberately not published to a host
      # interface by default. Uncomment to test against a local MUA — note it
      # binds loopback only, and that the local listener is plaintext with
      # plaintext AUTH, so it must never be bound to a routable interface.
      # - '127.0.0.1:2525:25'
      - '127.0.0.1:8080:8080'   # admin API (§9)
      # D-083's link proxy, when `link_proxy:` is configured. Not published by
      # default; NET_BIND_SERVICE below already covers port 80.
      # - '127.0.0.1:8081:80'
    volumes:
      # §5.1's certificate for the acceptance stack (D-070), minted per run by
      # `tls-init`. Mounted in local development too, where it is empty and
      # unused: `simmer.yaml` configures no TLS, and a mount that differed by
      # profile would make compose re-create `app` between the two.
      - acceptance-tls:/tls:ro
      # D-085's capture directory. Commented out with the `capture:` block in
      # simmer.yaml: mounting it unconditionally would make compose re-create
      # `app` when the block is uncommented, and the two belong together.
      #
      # A named volume rather than a bind mount, and this is load-bearing twice
      # over: `read_only: true` below means the container cannot write to its own
      # filesystem, and the process runs as UID 1000, which a host directory is
      # unlikely to be owned by.
      #
      # A *fresh* named volume is created root-owned, so the first start refuses
      # with `capture.directory ... is not writable` — which is the right
      # failure, since the alternative is a capture that silently records
      # nothing. Give it to UID 1000 once:
      #
      #   docker run --rm -v simmer_capture:/d alpine chown 1000:1000 /d
      #
      # It holds plaintext mail — treat it as a mailbox, and
      # `docker volume rm simmer_capture` when the investigation is over.
      # - capture:/var/lib/simmer/capture
      #
      # §7.7's spool body store (D-117), for a ramp with `delivery: spool` and a
      # `spool: { body_store: { kind: volume, path: /var/lib/simmer/spool } }`
      # block. Commented out for the capture's reason above, and it needs the
      # capture's one-time `chown 1000:1000` too (startup's write-and-read-back
      # probe refuses otherwise). Unlike the capture this is NOT a debugging
      # artefact: it holds accepted mail Simmer has promised to deliver, so it
      # must outlive the container — never a tmpfs — and must be drained
      # (`POST /ramps/{ramp}/spool/drain`) before it is removed.
      # - spool:/var/lib/simmer/spool
    read_only: true
    # The container runs as non-root (UID 1000), and §5.1 defaults the listener
    # to port 25 — a privileged port. Without this the SMTP bind fails with
    # EACCES in phase 2. Granting one capability is a much smaller concession
    # than running the process as root.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      # §8.1: the DATA payload is buffered in memory to 1 MiB and spilled to a
      # temporary file above that. It is a transient buffer, not a spool — a
      # tmpfs guarantees nothing survives a crash, which is what §2.2 requires.
      #
      # Worst case is max_message_bytes × max_concurrent_sessions (25 MiB × 64 =
      # 1.6 GiB), but that assumes every concurrent session is carrying a
      # maximum-size message simultaneously. 512 MiB covers ~20 concurrent
      # large messages; if simmer_messages_total starts showing 451s with no
      # downstream error, this is the first thing to raise.
      #
      # Interpolable so a stress scenario can shrink it and make the spill fail
      # (F5). It lives here rather than in the stress override because compose
      # *appends* sequence keys across files: an override would leave two /tmp
      # entries rather than replacing this one.
      - /tmp:rw,noexec,nosuid,size=${SIMMER_TMPFS_SIZE:-512m}
    environment:
      DATABASE_URL: "postgres://simmer:simmer@simmer-db:5432/simmer"
      # §9.3's bearer token. Local development only — never a real credential.
      # Long enough not to trip §4.2's short-token warning, so that when the
      # warning does appear it means something.
      SIMMER_ADMIN_TOKEN: "local-dev-token-not-a-secret"
      # argon2id hash of "local-dev-password". The `$$` are compose escaping for
      # a literal `$`. Local development only — never a real credential.
      SIMMER_CFAPP_HASH: "$$argon2id$$v=19$$m=19456,t=2,p=1$$iYj0sVhRvzAWM9kzsFBKyg$$V1tnVXTGEO+BD0x9q1uccuo91w84jrz+qDKA3qElLFE"
      POSTAL_USER: "postal"
      POSTAL_PASS: "postal-local"
      SENDGRID_KEY: "SG.local"
      RUST_LOG: "info,sqlx=warn"
      # Both default to the local-development answer, so `docker compose up -d`
      # is unchanged. The acceptance suite overrides them in its own environment
      # and re-creates this one service: that is the whole mechanism by which the
      # ramp is walked across simulated day boundaries (docs/ACCEPTANCE.md §3),
      # since §2.2 rules out a hot reload.
      SIMMER_CONFIG: "${SIMMER_CONFIG:-/app/simmer.yaml}"
      SIMMER_WARMUP_STARTED: "${SIMMER_WARMUP_STARTED:-2026-08-01T09:00:00Z}"
      # Where `simmer.acceptance.yaml` finds its certificate. Unused by
      # `simmer.yaml`.
      SIMMER_TLS_DIR: "/tls"
    healthcheck:
      # Must match the Dockerfile HEALTHCHECK exactly.
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      simmer-db:
        condition: service_healthy
      # Acceptance only. `required: false` is what keeps plain `docker compose
      # up -d` working: without the profile `tls-init` does not exist, and a
      # required dependency on it would refuse to start `app` at all.
      tls-init:
        condition: service_completed_successfully
        required: false

  simmer-db:
    image: postgres:18
    environment:
      POSTGRES_DB: simmer
      POSTGRES_USER: simmer
      POSTGRES_PASSWORD: simmer
    ports:
      # Fixed rather than ephemeral: the phase 3 tests reach this database
      # directly (see README "Development"). 5433 to avoid clashing with a
      # Postgres already running on the developer's machine.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h simmer-db -U simmer"]
      interval: 2s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------------------------
  # D-084: SQL Server, for the `mssql` build's storage tests. Behind a profile,
  # so `docker compose up -d` is unchanged:
  #
  #   docker compose --profile mssql up -d simmer-mssql-db
  #   MSSQL_URL='server=tcp:127.0.0.1,1434;user id=sa;password=Simmer-dev-1!;TrustServerCertificate=true' \
  #     cargo test --no-default-features --features mssql --test store_mssql
  #
  # amd64 only: Microsoft publishes no arm64 image. 1434 on the host to sit
  # beside a SQL Server a developer may already run on 1433, as the Postgres
  # service uses 5433. Local development only — never a real credential.
  simmer-mssql-db:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Simmer-dev-1!"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Simmer-dev-1!' -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 30

  # -------------------------------------------------------------------------
  # The acceptance stack — docs/ACCEPTANCE.md, DECISIONS.md D-032.
  #
  # Behind a profile, so `docker compose up -d` keeps meaning exactly what it
  # meant before and none of this starts unless it is asked for:
  #
  #   docker compose -f docker-compose.yml -f test/compose/acceptance.yml \
  #     --profile acceptance up -d --build
  #   cargo test --test acceptance -- --ignored --test-threads=1
  #
  # `tests/acceptance.rs` drives it: it restarts `app` with a different
  # SIMMER_WARMUP_STARTED to walk the ramp, runs `loadgen`, and reads the traps'
  # HTTP APIs and Postgres — both of which are safe to publish to loopback.
  # -------------------------------------------------------------------------

  # Two traps, not one. With a single sink you can only assert on headers Simmer
  # wrote, which proves it *said* it used the overflow route rather than that it
  # did. Two separate servers make the routing decision a physical fact.
  trap-warming:
    profiles: ["acceptance"]
    # Pinned by digest, not by tag: the suite reads this API's JSON field names,
    # and `:latest` moving under it would be a failure with no commit behind it.
    # v1.30.7.
    image: axllent/mailpit@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      # 18025 rather than Mailpit's conventional 8025: that port and MailHog's
      # 8025 are the same number, and a developer with any other mail trap
      # running loses the acceptance stack to a port clash. SMTP stays on the
      # container network and is never published.
      - "127.0.0.1:18025:8025"
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_MAX_MESSAGES: "0"          # no eviction — the suite counts them
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 20

  trap-overflow:
    profiles: ["acceptance"]
    image: axllent/mailpit@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      - "127.0.0.1:18026:8025"
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_MAX_MESSAGES: "0"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 20

  # §5.1's certificate for the acceptance stack (D-070): a throwaway CA and a
  # leaf for `simmer.acceptance` it issued, written to the `acceptance-tls`
  # volume. A real two-level chain rather than a self-signed leaf, because the
  # loadgen *verifies* — and webpki refuses a CA certificate presented as an end
  # entity. Minted on every `up`, so nothing in the repository is a private key
  # and nothing expires between runs. Thirty days rather than one so that §5.1's
  # fourteen-day expiry warning stays quiet: in this log it would mean nothing.
  #
  # The runtime image rather than a separate one: Debian's ca-certificates
  # depends on openssl, so the shipped image already carries the CLI, and
  # building this from it means nothing extra to pull or pin. Root only to write
  # the volume; the files are then handed to UID 1000, which is who reads them.
  tls-init:
    profiles: ["acceptance"]
    build:
      context: .
      target: runtime
    user: "0"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        cd /tls
        openssl req -x509 -new -noenc -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -keyout /tmp/ca.key -out ca.pem -days 30 -subj /CN=simmer-acceptance-ca 2>/dev/null
        openssl req -new -noenc -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -keyout key.pem -out /tmp/leaf.csr -subj /CN=simmer.acceptance 2>/dev/null
        printf '%s\n' 'subjectAltName=DNS:simmer.acceptance' \
          'basicConstraints=critical,CA:FALSE' \
          'keyUsage=critical,digitalSignature' \
          'extendedKeyUsage=serverAuth' > /tmp/leaf.ext
        openssl x509 -req -in /tmp/leaf.csr -CA ca.pem -CAkey /tmp/ca.key \
          -CAserial /tmp/ca.srl -CAcreateserial -days 30 -extfile /tmp/leaf.ext \
          -out cert.pem 2>/dev/null
        cat ca.pem >> cert.pem
        chown 1000:1000 ca.pem cert.pem key.pem
        chmod 0644 ca.pem cert.pem
        chmod 0600 key.pem
        # The T2 matrix's TLS downstream (test/compose/matrix.yml). Simmer
        # verifies it against the route's downstream host, so the name is the
        # compose service name. Root-owned: Postfix reads its key as root, at
        # startup, before dropping privileges.
        mkdir -p postfix-tls-auth
        openssl req -new -noenc -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -keyout postfix-tls-auth/key.pem -out /tmp/pf.csr -subj /CN=postfix-tls-auth 2>/dev/null
        printf '%s\n' 'subjectAltName=DNS:postfix-tls-auth' \
          'basicConstraints=critical,CA:FALSE' \
          'keyUsage=critical,digitalSignature' \
          'extendedKeyUsage=serverAuth' > /tmp/pf.ext
        openssl x509 -req -in /tmp/pf.csr -CA ca.pem -CAkey /tmp/ca.key \
          -CAserial /tmp/ca.srl -days 30 -extfile /tmp/pf.ext \
          -out postfix-tls-auth/cert.pem 2>/dev/null
        cat ca.pem >> postfix-tls-auth/cert.pem
        chmod 0644 postfix-tls-auth/cert.pem
        chmod 0600 postfix-tls-auth/key.pem
        # The same CA, installed the way an operator installs an internal CA:
        # into the OS trust store. The result is exported to `test-trust`, which
        # test/compose/acceptance.yml mounts over /etc/ssl/certs in every
        # verifying container, so their handshakes go through the real platform
        # lookup (rustls-native-certs -> openssl-probe -> /etc/ssl/certs) rather
        # than a CA path handed to the client. Copied with -L: the store is
        # symlinks into /usr/share and /usr/local/share, which would dangle in
        # another container.
        cp ca.pem /usr/local/share/ca-certificates/simmer-acceptance-ca.crt
        update-ca-certificates >/dev/null 2>&1
        rm -rf /trust/* /trust/.[!.]*
        cp -rL /etc/ssl/certs/. /trust/
    volumes:
      - acceptance-tls:/tls
      - test-trust:/trust
    healthcheck:
      disable: true

  # D-126 — a dummy OTLP collector for the acceptance stack, which
  # `simmer.acceptance.yaml` exports to. It writes everything it receives to the
  # `otel-out` volume as JSON lines (test/otel/collector.yaml), and
  # tests/telemetry_compose.rs reads them back through the loadgen, which mounts
  # the volume read-only. Nothing is forwarded anywhere.
  #
  # Not a dependency of `app`, deliberately: telemetry must never be able to
  # stop Simmer starting, and the export connects lazily, so `app` does not care
  # which comes up first.
  otel-collector:
    profiles: ["acceptance"]
    # Pinned by digest, like the traps: the test reads the file exporter's JSON.
    # v0.161.0.
    image: otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/collector.yaml"]
    # UID 1000, the loadgen's, so the files it writes (0600) are readable there.
    user: "1000:1000"
    volumes:
      - ./test/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - otel-out:/otel
    depends_on:
      otel-init:
        condition: service_completed_successfully

  # A fresh named volume is root-owned; the collector runs as UID 1000. The
  # `capture-init` precedent (test/compose/capture.yml).
  #
  # **It does not empty the files.** `up` re-runs this one-shot without
  # re-creating a collector that is already running, and that collector holds
  # its current files open at an offset: deleting them left it writing to
  # unlinked inodes, and truncating them left a hole of NULs in front of its
  # next line (both found while writing docs/SOAK.md §18). So the files
  # accumulate, bounded by the exporter's rotation, and tests/telemetry_compose.rs
  # reads only what was exported after it started.
  otel-init:
    profiles: ["acceptance"]
    image: alpine:3.20
    entrypoint: ["sh", "-ec"]
    command:
      - |
        chown 1000:1000 /otel
    volumes:
      - otel-out:/otel

  # Built from the Dockerfile's `acceptance` stage, which adds the loadgen binary
  # on top of the runtime image. Never started by `up`: the host test invokes it
  # with `docker compose run --rm loadgen …` and reads its stdout.
  loadgen:
    profiles: ["acceptance"]
    build:
      context: .
      target: acceptance
    environment:
      SIMMER_PASSWORD: "local-dev-password"
    volumes:
      # For `--starttls`: the CA the loadgen verifies Simmer's certificate
      # against.
      - acceptance-tls:/tls:ro
      # D-126 — what the dummy collector received, for tests/telemetry_compose.rs
      # to `cat`.
      - otel-out:/otel:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  # D-085's capture directory, used only when the mount above and the `capture:`
  # block in simmer.yaml are both uncommented. Declared unconditionally because a
  # volume nothing mounts costs nothing.
  capture:
  # §7.7's spool body store; used only when the mount above is uncommented.
  spool:
  acceptance-tls:
  # tls-init's OS trust store: Debian's roots plus the per-run test CA. Mounted
  # only by the acceptance override (test/compose/acceptance.yml) — mounted here,
  # a plain `docker compose up`, where tls-init never runs, would give `app` an
  # empty root store and break every real `required_verify` route.
  test-trust:
  # D-126 — the dummy collector's output. Acceptance only.
  otel-out:
