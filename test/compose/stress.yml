# The T3 stress stack (docs/TESTING.md; the test programme's step 4). Layered on
# the acceptance stack:
#
#   docker compose -f docker-compose.yml -f test/compose/acceptance.yml \
#     -f test/compose/stress.yml --profile acceptance --profile stress build
#   ... up -d --wait app sink
#   cargo test --test stress -- --ignored --test-threads=1
#
# `tests/compose/stack.rs`'s STRESS stack builds every command with exactly these
# files and profiles.
#
# `app` runs test/config/simmer.stress.yaml under the resource limits the stress
# bar is stated against: the scenarios gate on bounds holding and on no OOM kill
# at 1 GiB, and neither means anything on an unlimited container.

services:
  app:
    # Two by default, because the stated bar is that the bounds hold on a small
    # machine. A scenario can ask for more through the harness's per-scenario
    # environment: F3a is a *concurrency* finding, so how many argon2 verifies —
    # and their 19 MiB buffers — coexist depends on the cores available.
    cpus: "${STRESS_APP_CPUS:-2}"
    mem_limit: 1g
    ulimits:
      # Generous by default; S1b shrinks it so accept() starts returning EMFILE
      # and the §5.1 loop's behaviour under descriptor exhaustion is observable
      # (F6). Soft and hard together, or the process could raise it back.
      nofile:
        soft: "${STRESS_APP_NOFILE:-65536}"
        hard: "${STRESS_APP_NOFILE:-65536}"
    environment:
      # simmer.stress.yaml reads this; S9 overrides it to catch a relay in flight.
      # Defaulted here so every other command renders `app` identically.
      SIMMER_SESSION_TIMEOUT: "${SIMMER_SESSION_TIMEOUT:-120s}"
    volumes:
      - stress-config:/config:ro
    depends_on:
      stress-config:
        condition: service_completed_successfully

  # A second instance of the same Simmer, on the same database (S7, and the soak
  # tier's A/B pair). One quota, two processes: §7.4's reservation protocol is
  # what stops them both spending the same allowance.
  #
  # Declared in full rather than with `extends:`, deliberately. `app` above is an
  # override of the base file's service; `app2` has no base to inherit, and
  # compose's `extends` *merges* multi-value keys, so it would publish the base's
  # 127.0.0.1:8080:8080 alongside its own and clash — besides silently dropping
  # depends_on. Everything here that mirrors the base `app` must be kept in step
  # with it: the build target, the config, and above all SIMMER_WARMUP_STARTED,
  # since a different warm-up instant means a different §7.2 day index and the two
  # instances would quietly account against different rows instead of contending.
  app2:
    profiles: ["stress"]
    build:
      context: .
      # The Dockerfile's last stage is `acceptance` (the loadgen), so this pin is
      # load-bearing exactly as it is for `app`.
      target: runtime
    cpus: "${STRESS_APP_CPUS:-2}"
    mem_limit: 1g
    ports:
      # Its own admin port: 8080 is `app`'s and 18081 is the sink's stats.
      - "127.0.0.1:8081:8080"
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      # The same database as `app`. That is the point of this service.
      DATABASE_URL: "postgres://simmer:simmer@simmer-db:5432/simmer"
      SIMMER_ADMIN_TOKEN: "local-dev-token-not-a-secret"
      SIMMER_CFAPP_HASH: "$$argon2id$$v=19$$m=19456,t=2,p=1$$iYj0sVhRvzAWM9kzsFBKyg$$V1tnVXTGEO+BD0x9q1uccuo91w84jrz+qDKA3qElLFE"
      POSTAL_USER: "postal"
      POSTAL_PASS: "postal-local"
      SENDGRID_KEY: "SG.local"
      RUST_LOG: "info,sqlx=warn"
      SIMMER_CONFIG: "${SIMMER_CONFIG:-/app/simmer.yaml}"
      SIMMER_WARMUP_STARTED: "${SIMMER_WARMUP_STARTED:-2026-08-01T09:00:00Z}"
      SIMMER_SESSION_TIMEOUT: "${SIMMER_SESSION_TIMEOUT:-120s}"
      SIMMER_TLS_DIR: "/tls"
    volumes:
      - acceptance-tls:/tls:ro
      - test-trust:/etc/ssl/certs:ro
      - stress-config:/config:ro
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      simmer-db:
        condition: service_healthy
      stress-config:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
        required: false

  # test/config/ into the `stress-config` volume. See test/config/Dockerfile for
  # why this is an image and not a bind mount.
  stress-config:
    profiles: ["stress"]
    build:
      context: .
      dockerfile: test/config/Dockerfile
    volumes:
      - stress-config:/config
    healthcheck:
      disable: true

  # Both routes' downstream: src/bin/sink.rs, one listener per route. It keeps
  # counts and one JSON line per message and nothing that grows with the body,
  # so under load it is neither the bottleneck nor the leak.
  #
  # Faults are per scenario: the harness re-creates this service with SINK_ARGS
  # set (`--slow-ms 2000`, `--stall-at-dot-pct 1`, `--lose-every 50`, …) and the
  # JSONL starts afresh. Root, like the loadgen here, only so both can write the
  # results volume.
  sink:
    profiles: ["stress"]
    build:
      context: .
      target: acceptance
    user: "0"
    entrypoint:
      - sh
      - -ec
      - exec /app/sink --listen 0.0.0.0:2525 --listen 0.0.0.0:2526 --http 0.0.0.0:8081 --jsonl /results/sink.jsonl $${SINK_ARGS:-}
    environment:
      SINK_ARGS: "${SINK_ARGS:-}"
    ports:
      - "127.0.0.1:18081:8081"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - stress-results:/results
    # The image's HEALTHCHECK is the server's; this is not the server.
    healthcheck:
      disable: true

  # Hundreds of clients from one container: descriptors, and somewhere to write
  # the per-message record the harness reconciles against the sink's.
  loadgen:
    user: "0"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - stress-results:/results

volumes:
  stress-config:
  stress-results:
